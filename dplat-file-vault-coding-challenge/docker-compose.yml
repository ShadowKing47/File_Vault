services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/media
      - backend_static:/app/staticfiles
      - backend_data:/app/data
      - backend_logs:/app/logs
      - backend_node1:/app/object_store_node1
      - backend_node2:/app/object_store_node2
      - backend_node3:/app/object_store_node3
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=insecure-dev-only-key
    restart: always

volumes:
  backend_storage:
  backend_static:
  backend_data:
  backend_logs:
  backend_node1:
  backend_node2:
  backend_node3: 